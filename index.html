<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbf9" />
    <meta name="description" content="A grocery list that groups by aisle, remembers what things cost you, and keeps a running total against a budget." />
    <!-- %BASE_URL% is substituted by Vite, so these keep working whether the
         app is served from the root or from a /repo-name/ subpath. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <!-- iOS ignores SVG here and renders a blank tile, which is what anyone
         adding CartWise to an iPhone home screen was getting. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CartWise" />
    <!-- Lets the page paint under the status bar, which is why every screen
         carries a safe-area inset. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS launch images. Android builds its own splash from the manifest;
         iOS shows a blank white screen without these, for as long as the app
         takes to parse and paint. They are stills of the in-app launch screen,
         so the handover from the static image to the animated one is
         invisible. Regenerate with `npm run launch-images`. -->
    <link rel="apple-touch-startup-image" href="%BASE_URL%launch/launch-1320x2868.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%BASE_URL%launch/launch-1206x2622.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%BASE_URL%launch/launch-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%BASE_URL%launch/launch-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%BASE_URL%launch/launch-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%BASE_URL%launch/launch-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%BASE_URL%launch/launch-1242x2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%BASE_URL%launch/launch-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%BASE_URL%launch/launch-1242x2208.png"
      media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%BASE_URL%launch/launch-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <title>CartWise</title>
    <!-- Instrument Serif for display moments, Inter for everything else. A
         serif wordmark against a grotesque UI reads as considered; the marker
         face this replaced read as a craft app.

         Served from here rather than fonts.googleapis.com. Google saw the IP
         of everyone who opened CartWise, which is hard to square with a
         privacy page promising no third parties, and the app fell back to
         system fonts whenever it was offline. Both families are SIL Open Font
         License 1.1. Refresh them with `npm run fonts`. -->
    <link href="./fonts/fonts.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
