<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbf9" />
    <meta name="description" content="A grocery list that groups by aisle, remembers what things cost you, and keeps a running total against a budget." />
    <!-- %BASE_URL% is substituted by Vite, so these keep working whether the
         app is served from the root or from a /repo-name/ subpath. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <!-- iOS ignores SVG here and renders a blank tile, which is what anyone
         adding CartWise to an iPhone home screen was getting. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CartWise" />
    <!-- Lets the page paint under the status bar, which is why every screen
         carries a safe-area inset. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>CartWise</title>
    <!-- Instrument Serif for display moments, Inter for everything else. A
         serif wordmark against a grotesque UI reads as considered; the marker
         face this replaced read as a craft app.

         Served from here rather than fonts.googleapis.com. Google saw the IP
         of everyone who opened CartWise, which is hard to square with a
         privacy page promising no third parties, and the app fell back to
         system fonts whenever it was offline. Both families are SIL Open Font
         License 1.1. Refresh them with `npm run fonts`. -->
    <link href="./fonts/fonts.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
