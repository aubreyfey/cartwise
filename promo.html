<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CartWise store panels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #222; }

      /* App Store 6.7"/6.9" iPhone size. */
      .panel {
        width: 1290px;
        height: 2796px;
        position: relative;
        overflow: hidden;
        display: none;
        flex-direction: column;
        align-items: center;
        font-family: 'Inter', system-ui, sans-serif;
        background: #f6f5f2;
        color: #16151a;
        letter-spacing: -0.01em;
      }
      .panel.on { display: flex; }

      /* One faint wash of the panel's own hue, set per panel by --tint. Colour
         arrives as atmosphere behind the phone rather than as a flat gradient
         the eye reads as a background. */
      .panel::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 460px;
        width: 2100px;
        height: 2100px;
        transform: translateX(-50%);
        background: radial-gradient(closest-side, var(--tint, transparent), transparent 72%);
        pointer-events: none;
      }

      .head { padding: 190px 96px 0; text-align: center; z-index: 2; }
      .eyebrow {
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent, #6d5bd0);
        margin-bottom: 40px;
      }
      .title {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 138px;
        line-height: 0.98;
        letter-spacing: -0.02em;
        font-weight: 400;
      }
      .sub {
        margin: 40px auto 0;
        font-size: 46px;
        line-height: 1.4;
        font-weight: 400;
        color: #5d5a68;
        max-width: 930px;
        letter-spacing: -0.005em;
      }

      /* A thin, near-black bezel. The old one was a fat gradient slab with a
         purple glow; at store-listing size that read as a toy phone. */
      .phone {
        margin-top: 130px;
        width: 880px;
        border-radius: 66px;
        padding: 11px;
        background: #111014;
        box-shadow:
          0 4px 12px rgba(18, 16, 28, 0.10),
          0 44px 90px -20px rgba(18, 16, 28, 0.34);
        position: relative;
        z-index: 2;
      }
      .phone--tall { margin-top: 104px; }
      .screen {
        width: 100%;
        border-radius: 56px;
        overflow: hidden;
        background: #fbfbf9;
        display: block;
      }
      .screen img { width: 100%; display: block; }

      /* Dark panels: the same layout, inverted, so the set has a rhythm rather
         than eight pastel variations of one idea. */
      .panel--dark {
        background: #100f14;
        color: #f7f6f9;
      }
      .panel--dark .sub { color: rgba(247, 246, 249, 0.62); }
      .panel--dark .phone {
        background: #2a2833;
        box-shadow: 0 44px 100px -20px rgba(0, 0, 0, 0.6);
      }

      /* Hero */
      .wordmark {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 168px;
        line-height: 1;
        letter-spacing: -0.025em;
        color: #fff;
      }
      .tagline {
        margin-top: 44px;
        font-size: 52px;
        font-weight: 400;
        line-height: 1.32;
        color: rgba(255, 255, 255, 0.66);
        max-width: 940px;
        text-align: center;
        letter-spacing: -0.01em;
      }
      .badge {
        margin-top: 54px;
        display: inline-flex;
        gap: 20px;
        align-items: center;
        padding: 22px 44px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        font-size: 34px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.82);
        letter-spacing: 0.01em;
      }
      .badge span { opacity: 0.42; }
    </style>
  </head>
  <body>
    <script>
      const PANELS = [
        {
          hero: true,
          shot: 'home',
          tint: 'rgba(126, 102, 232, 0.55)',
        },
        {
          eyebrow: 'Budget',
          title: 'Know the total<br>before the till',
          sub: 'Every price sits on the row, and the budget bar moves as you shop. Nothing is a surprise at the checkout.',
          shot: 'budget',
          accent: '#2f7d43',
          tint: 'rgba(47, 125, 67, 0.20)',
        },
        {
          eyebrow: 'Price memory',
          title: 'It remembers<br>every price',
          sub: 'Type a name you have bought before and the price, unit and aisle fill themselves in, from your own shopping.',
          shot: 'shopping',
          accent: '#6d5bd0',
          tint: 'rgba(109, 91, 208, 0.20)',
        },
        {
          dark: true,
          eyebrow: 'Compare',
          title: 'Which shop is<br>actually cheaper?',
          sub: 'Compared only on what you have priced at both, and it says how much of the list that covers.',
          shot: 'compare',
          accent: '#f0a3a8',
          tint: 'rgba(206, 78, 86, 0.50)',
        },
        {
          eyebrow: 'Trips',
          title: 'Every trip,<br>remembered',
          sub: 'Finish a shop and it keeps what you bought, what it cost, and how it landed against your budget.',
          shot: 'receipt',
          accent: '#2f5f9e',
          tint: 'rgba(47, 95, 158, 0.19)',
        },
        {
          eyebrow: 'Expiry',
          title: 'Know what<br>to eat first',
          sub: 'Track what is in the fridge and what is about to turn. Expired, today, this week, sorted for you.',
          shot: 'expiry',
          accent: '#b47410',
          tint: 'rgba(196, 130, 24, 0.22)',
        },
        {
          dark: true,
          eyebrow: 'Insights',
          title: 'See where<br>the money went',
          sub: 'Spend by aisle and by shop, how often you land under budget, and what the impulse buys really cost.',
          shot: 'insights',
          accent: '#7fd8c4',
          tint: 'rgba(31, 138, 116, 0.50)',
        },
        {
          eyebrow: 'Private',
          title: 'Stays on<br>your phone',
          sub: 'No account, no sign-up, no analytics. Your lists and prices never leave the device, and it works offline.',
          shot: 'list',
          accent: '#3c3550',
          tint: 'rgba(78, 68, 108, 0.16)',
        },
      ]

      // The basket mark, matched to the app icon. Drawn rather than emoji so the
      // wordmark holds up at 1290px wide.
      const MARK = `<svg width="128" height="128" viewBox="0 0 48 48" fill="none">
        <path d="M17 7v11M31 7v11" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-linecap="round"/>
        <path d="M7 18h34l-3.6 19.2A5 5 0 0 1 32.5 41h-17a5 5 0 0 1-4.9-3.8z" fill="#fff"/>
      </svg>`

      const which = Number(new URLSearchParams(location.search).get('p') || 1)
      const panel = PANELS[which - 1]

      const body = panel.hero
        ? `<div class="head" style="padding-top:250px">
             <div class="wordmark">${MARK} CartWise</div>
             <p class="tagline">The grocery list that remembers<br>what things cost.</p>
             <div class="badge">Works offline <span>&middot;</span> No account</div>
           </div>
           <div class="phone phone--tall"><div class="screen"><img src="/marketing/shots/${panel.shot}.png" alt=""></div></div>`
        : `<div class="head">
             <p class="eyebrow">${panel.eyebrow}</p>
             <h1 class="title">${panel.title}</h1>
             <p class="sub">${panel.sub}</p>
           </div>
           <div class="phone"><div class="screen"><img src="/marketing/shots/${panel.shot}.png" alt=""></div></div>`

      const cls = ['panel', 'on']
      if (panel.hero || panel.dark) cls.push('panel--dark')
      const vars = [
        panel.tint ? `--tint:${panel.tint}` : '',
        panel.accent ? `--accent:${panel.accent}` : '',
      ].filter(Boolean).join(';')

      document.body.innerHTML = `<div class="${cls.join(' ')}" style="${vars}">${body}</div>`
    </script>
  </body>
</html>
